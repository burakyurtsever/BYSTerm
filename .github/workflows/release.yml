name: Build & Release

# Yeni sürüm iki yoldan çıkar:
#  1) GitHub > Actions > "Build & Release" > Run workflow > sürüm (ör. 0.3.1) yaz > Run
#     (etiketi workflow kendisi oluşturur)
#  2) git tag v0.3.1 && git push origin v0.3.1
# Tüm platformlar derlenir, her biri kendi selftest'inden geçer, sonra Releases'a yüklenir.
# Sürüm boş bırakılırsa sadece derlenir/test edilir (Release oluşmaz).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm (ör. 0.3.1). Boş = sadece derle/test et'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }   # Jetson
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build in Ubuntu 18.04 (glibc 2.27 -> runs on 18.04+ and all JetPacks)
        run: docker run --rm -v "$PWD":/src -w /src ubuntu:18.04 bash ci/build_linux_docker.sh
      - name: Selftest on Ubuntu 18.04 / 20.04 / 22.04 / 24.04
        timeout-minutes: 15
        run: |
          mkdir -p /tmp/t && tar -C /tmp/t -xzf release/BYSTerm-linux-${{ matrix.arch }}.tar.gz
          for img in ubuntu:18.04 ubuntu:20.04 ubuntu:22.04 ubuntu:24.04; do
            docker run --rm -v /tmp/t/BYSTerm:/app -v "$PWD/ci":/ci $img bash /ci/selftest_linux.sh
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: release/*

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.8', architecture: x64 }   # 3.8 = Windows 7/8.1 desteği
      - run: python -m pip install pyserial==3.5 PyQt5==5.15.10 PyQt5-Qt5==5.15.2 PyQt5-sip pyinstaller==5.13.2
      - name: USB serial capture tests (Windows)
        timeout-minutes: 5
        run: python src/test_bysterm_usbsniff.py
      - run: python ci/build.py
      - name: Selftest
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process -FilePath release\BYSTerm-windows-x64.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
          "selftest OK"
      - name: Fetch com0com (signed virtual serial driver, best effort)
        shell: pwsh
        continue-on-error: true
        run: |
          $ver = if ('${{ github.ref_name }}' -match 'v(.+)') { $matches[1] } elseif ('${{ inputs.version }}') { '${{ inputs.version }}' } else { '0.0.0' }
          "BYSTERM_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force installer\com0com | Out-Null
          # imzali com0com (3.0.0.0, i386+x64). Birkac aynaya sirayla bak; indirilen dosya ZIP mi diye dogrula.
          $urls = @(
            'https://sourceforge.net/projects/com0com/files/com0com/3.0.0.0/com0com-3.0.0.0-i386-and-x64-signed.zip/download',
            'https://downloads.sourceforge.net/project/com0com/com0com/3.0.0.0/com0com-3.0.0.0-i386-and-x64-signed.zip',
            'https://master.dl.sourceforge.net/project/com0com/com0com/3.0.0.0/com0com-3.0.0.0-i386-and-x64-signed.zip'
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile com0com.zip -UseBasicParsing -TimeoutSec 180 -Headers @{ 'User-Agent' = 'Mozilla/5.0' }
              $fs = [IO.File]::OpenRead((Resolve-Path com0com.zip)); $b = New-Object byte[] 2; $null = $fs.Read($b,0,2); $fs.Close()
              if ($b[0] -eq 0x50 -and $b[1] -eq 0x4B) { $ok = $true; Write-Host "com0com indi: $u"; break }
              else { Write-Host "ZIP degil (aynadan HTML geldi): $u" }
            } catch { Write-Host "basarisiz: $u -> $_" }
          }
          if ($ok) {
            Expand-Archive com0com.zip -DestinationPath installer\com0com -Force
            # setup.exe ustu bir alt klasorde olabilir -> koke tasi
            $setup = Get-ChildItem installer\com0com -Recurse -Filter setup.exe | Select-Object -First 1
            if ($setup -and $setup.DirectoryName -ne (Resolve-Path installer\com0com).Path) {
              Copy-Item "$($setup.DirectoryName)\*" installer\com0com -Recurse -Force
            }
            if (Test-Path installer\com0com\setup.exe) {
              "WITH_COM0COM=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Write-Host "com0com pakete eklenecek."
            } else { Write-Host "setup.exe bulunamadi; com0com'suz devam." }
          } else { Write-Host "Hicbir ayna vermedi; installer com0com'suz uretilecek." }
      - name: Fetch USBPcap (signed USB capture driver for live serial monitoring)
        shell: pwsh
        run: |
          $u = 'https://github.com/desowin/usbpcap/releases/download/1.5.4.0/USBPcapSetup-1.5.4.0.exe'
          for ($i = 1; $i -le 4; $i++) {
            try { Invoke-WebRequest -Uri $u -OutFile installer\USBPcapSetup.exe -UseBasicParsing -TimeoutSec 120; break }
            catch { Write-Host "deneme $i basarisiz: $_"; Start-Sleep -Seconds (2 * $i) }
          }
          $h = (Get-FileHash installer\USBPcapSetup.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne '87a7edf9bbbcf07b5f4373d9a192a6770d2ff3add7aa1e276e82e38582ccb622') { throw "USBPcap ozet uyusmuyor: $h" }
          $sig = Get-AuthenticodeSignature installer\USBPcapSetup.exe
          Write-Host "imza: $($sig.Status) $($sig.SignerCertificate.Subject)"
          "WITH_USBPCAP=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $ver = if ($env:BYSTERM_VERSION) { $env:BYSTERM_VERSION } else { '0.0.0' }
          $args = @("/DAppVersion=$ver")
          if ($env:WITH_COM0COM -eq '1') { $args += '/DWithCom0com=1' }
          if ($env:WITH_USBPCAP -eq '1') { $args += '/DWithUSBPcap=1' }
          $args += 'installer\bysterm.iss'
          & $iscc @args
          Copy-Item installer\Output\BYSTerm-Setup-windows-x64.exe release\ -Force
          Get-ChildItem release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-14 }        # Apple Silicon (M1..M4)
          - { arch: x64,   runner: macos-15-intel }  # Intel Mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install pyserial==3.5 PyQt5==5.15.11 pyinstaller==6.11.1
      - run: python ci/build.py
      - name: Selftest
        timeout-minutes: 5
        run: dist/BYSTerm.app/Contents/MacOS/BYSTerm --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          name: BYSTerm ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          body: |
            ## İndir
            | Sistem | Dosya |
            |---|---|
            | Windows 10/11 — **kurulum (önerilen)** | `BYSTerm-Setup-windows-x64.exe` — çift tıkla, kur |
            | Windows 10/11 — taşınabilir (kurulumsuz) | `BYSTerm-windows-x64.exe` |
            | macOS Apple Silicon (M1–M4) | `BYSTerm-macos-arm64.zip` |
            | macOS Intel | `BYSTerm-macos-x64.zip` |
            | Linux PC (Ubuntu 18.04+) | `BYSTerm-linux-x64.tar.gz` |
            | NVIDIA Jetson (JetPack 4 / 5 / 6), Raspberry Pi 64-bit | `BYSTerm-linux-arm64.tar.gz` |

            Taşınabilir sürüm ve Linux/Mac paketleri kurulum gerektirmez.

            **Seri İzleme:** sadece portu seçin; portu başka bir uygulama kullanırken trafiği sanal port
            olmadan görürsünüz. Linux/Jetson'da doğrudan; Windows'ta USB-seri çeviriciler için ücretsiz,
            imzalı USBPcap sürücüsüyle (kurulumda tek tik, sonra yeniden başlatma).
            **Sanal Port:** köprü (gerçek ↔ sanal), birbirine bağlı sanal port çifti ve donanım tap.
            USBPcap: GPL-2.0, kaynak kodu https://github.com/desowin/usbpcap. Ayrıntılar: README.
